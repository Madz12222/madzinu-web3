<script>
    // 1. Language Switcher
    function changeLanguage(lang) {
        localStorage.setItem('madzinu_lang', lang);
        const selectedDict = dictionary[lang] || dictionary['en'];
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (selectedDict && selectedDict[key]) {
                el.innerText = selectedDict[key];
            }
        });
    }

    // 2. User Login Modal
    function openUserLoginModal() {
        const m = document.getElementById('user-login-modal');
        if (m) m.style.display = 'flex';
    }
    function closeUserLoginModal() {
        const m = document.getElementById('user-login-modal');
        if (m) m.style.display = 'none';
    }

    // 3. AI Assistant Chat Modal
    function toggleMadzinuAIChat() {
        const d = document.getElementById('madzinu-ai-drawer');
        if (d) {
            d.style.display = (d.style.display === 'none' || d.style.display === '') ? 'flex' : 'none';
        }

    function closeMadzinuAI() {
        const d = document.getElementById('madzinu-ai-drawer');
        if (d) d.style.display = 'none';
    }

    function sendMadzinuAIMessageModal() {
        const input = document.getElementById('ai-modal-user-input');
        const chatBody = document.getElementById('ai-chat-messages');
        if (!input || !chatBody) return;
        let query = input.value.trim();
        if(!query) return;

        chatBody.innerHTML += '<div style="background: #1f2937; padding: 8px 10px; border-radius: 6px; color: #fff; text-align: right; margin-left: 20px;"><b>You:</b> ' + query + '</div>';
        input.value = "";

        let q = query.toLowerCase();
        let reply = "🤖 <b>Madzinu AI Assistant:</b> We offer Server Nodes from ₹2,000 to ₹1,00,000 (14-day cycle), daily micro-tasks (₹100/day), 10-12% referral bonuses, and 24K Gold conversion.";

        if (q.includes("price") || q.includes("server") || q.includes("package") || q.includes("cost") || q.includes("plan")) {
            reply = "🚀 <b>Server Node Tiers (14-Day Cycle):</b><br>• ₹2,000 Server: ₹155.50/day (Total ₹2,177)<br>• ₹5,000 Server: ₹394.64/day (Total ₹5,525)<br>• ₹10,000 Server: ₹792.86/day (Total ₹11,100)<br>• ₹25,000 Server: ₹1,991.07/day (Total ₹27,875)<br>• ₹50,000 Server: ₹4,000/day (Total ₹56,000)<br>• ₹1,00,000 Server: ₹8,000/day (Total ₹1,12,000)";
        } else if (q.includes("free") || q.includes("task") || q.includes("micro") || q.includes("jobwork")) {
            reply = "📊 <b>Free Tier Jobworks:</b> Complete 500 daily micro-tasks at ₹0.20/task to earn ₹100 daily! Min withdrawal: ₹100.";
        } else if (q.includes("pay") || q.includes("upi") || q.includes("bank") || q.includes("gpay")) {
            reply = "💳 <b>Payments:</b> Pay via UPI (<code>madhan958@slc</code>) or Slice Bank Transfer (Acc: <code>033311501076921</code>, IFSC: <code>NESF0000333</code>).";
        }

        setTimeout(() => {
            chatBody.innerHTML += '<div style="background: #1e1b4b; padding: 8px 10px; border-radius: 6px; color: #38bdf8; line-height: 1.4; border: 1px solid #312e81;"><b>Madzinu AI:</b> ' + reply + '</div>';
            chatBody.scrollTop = chatBody.scrollHeight;
        }, 300);
    }

    window.addEventListener('DOMContentLoaded', () => {
        const lang = localStorage.getItem('madzinu_lang') || 'en';
        const langSelect = document.getElementById('lang-select');
        if (langSelect) {
            langSelect.value = lang;
            changeLanguage(lang);
        }
    });
</script>

window.requestFast2SMSOTP = async function() {
    const phoneInput = document.getElementById('login-phone-input') || document.querySelector('input[type="tel"], input[type="text"]');
    if (!phoneInput || !phoneInput.value.trim()) {
        alert('❌ Please enter a valid mobile number.');
        return;
    }
    const phone = phoneInput.value.trim();
    alert('⏳ Requesting Fast2SMS OTP for ' + phone + '...');

    try {
        await fetch('/api/send-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: phone })
        });
    } catch (e) {
        console.log("Using demo fallback for OTP");
    }

    const step1 = document.getElementById('otp-step-1');
    const step2 = document.getElementById('otp-step-2');
    const statusMsg = document.getElementById('otp-status-msg');

    if (step1) step1.style.display = 'none';
    if (step2) step2.style.display = 'block';
    if (statusMsg) statusMsg.innerText = "✅ OTP Generated successfully for " + phone + ". Enter 6-digit code (Demo: 123456):";
};
</script>

window.requestFast2SMSOTP = async function() {
    const phoneInput = document.getElementById('login-phone-input') || document.querySelector('input[type="tel"], input[type="text"]');
    if (!phoneInput || !phoneInput.value.trim()) {
        alert('❌ Please enter a valid mobile number.');
        return;
    }
    const phone = phoneInput.value.trim();
    alert('⏳ Requesting Fast2SMS OTP for ' + phone + '...');

    try {
        await fetch('/api/send-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: phone })
        });
    } catch (e) {
        console.log("Using demo fallback for OTP");
    }

    const step1 = document.getElementById('otp-step-1');
    const step2 = document.getElementById('otp-step-2');
    const statusMsg = document.getElementById('otp-status-msg');

    if (step1) { step1.style.display = 'none'; }
    if (step2) { step2.style.display = 'block'; }
    if (statusMsg) { statusMsg.innerText = "✅ OTP Generated successfully for " + phone + ". Enter 6-digit code (Demo: 123456):"; }
};
</script>
