<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madzinu Web3 Technologies</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; text-align: center; width: 320px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; margin-bottom: 10px; }
        .balance { font-size: 28px; font-weight: bold; color: #34d399; margin: 20px 0; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; pointer-events: auto !important; }
        button { width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; pointer-events: auto !important; position: relative; z-index: 9999; }
        button:hover { background: #0ea5e9; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Madzinu Dashboard</h2>
        <p>Wallet Balance</p>
        <div class="balance" id="dash-wallet-balance">₹0.00</div>
        <input type="text" id="login-phone-input" placeholder="Enter Mobile Number">
        <button onclick="handleLogin()">Login / Request OTP</button>
    </div>

    <script>
        function handleLogin() {
            const phone = document.getElementById('login-phone-input').value.trim();
            if (!phone) {
                alert('❌ Please enter a valid mobile number.');
                return;
            }
            alert('⏳ OTP requested successfully for ' + phone);
        }
    </script>
</body>
</html>
