<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madzinu Web3 Technologies | Enterprise Cloud & Autonomous Workflows</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --card-border: #1f2937;
            --accent-indigo: #6366f1;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #090d16 100%); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        header { background: #0b101d; border-bottom: 1px solid var(--card-border); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .brand-title { font-size: 14px; font-weight: 800; color: #818cf8; letter-spacing: 0.5px; }
        .header-controls { display: flex; align-items: center; gap: 8px; }
        .header-btn { background: #111827; color: #38bdf8; border: 1px solid #334155; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .header-btn:hover { background: #1f2937; }

        .main-container { flex: 1; max-width: 1200px; width: 100%; margin: 0 auto; padding: 30px 20px; display: flex; flex-direction: column; gap: 24px; }
        
        .hero-card { background: rgba(17, 24, 39, 0.75); border: 1px solid var(--card-border); border-radius: 12px; padding: 30px; backdrop-filter: blur(10px); }
        .hero-card h1 { font-size: 24px; font-weight: 800; margin-bottom: 12px; color: #f8fafc; }
        .hero-card p { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 20px; }

        .auth-card { background: rgba(17, 24, 39, 0.85); border: 1px solid var(--card-border); border-radius: 12px; padding: 24px; max-width: 450px; width: 100%; margin: 0 auto; }
        .auth-card h3 { font-size: 16px; margin-bottom: 14px; color: #38bdf8; }
        .input-group { margin-bottom: 14px; }
        .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
        .input-group input { width: 100%; padding: 10px 12px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 14px; }
        .action-btn { width: 100%; background: #6366f1; color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .action-btn:hover { background: #4f46e5; }
        
        #otp-step-2 { display: none; margin-top: 15px; }
        .status-text { font-size: 12px; color: #10b981; margin-top: 8px; }
    </style>
</head>
<body>

    <header>
        <div class="brand-title"><i class="fa-solid fa-cube"></i> MADZINU WEB3</div>
        <div class="header-controls">
            <select id="lang-selector" class="header-btn" onchange="changeLanguage(this.value)">
                <option value="EN">EN</option>
                <option value="TA">தமிழ்</option>
                <option value="HI">हिन्दी</option>
                <option value="TE">తెలుగు</option>
                <option value="ML">മലയാളം</option>
                <option value="KN">ಕನ್ನಡ</option>
            </select>
        </div>
    </header>

    <div class="main-container">
        <div class="hero-card">
            <h1 id="portal-hero-title">Autonomous Web3 Infrastructure & Cloud Node Operations</h1>
            <p id="portal-hero-desc">Deploy high-throughput microservices, manage validator node allocations, and access real-time decentralized automation tools.</p>
        </div>

        <div class="auth-card">
            <h3><i class="fa-solid fa-shield-halved"></i> Fast2SMS Secure Authentication</h3>
            <div id="otp-step-1">
                <div class="input-group">
                    <label for="login-phone-input">Mobile Number (with Country Code)</label>
                    <input type="tel" id="login-phone-input" placeholder="e.g., 919840XXXXXX">
                </div>
                <button class="action-btn" onclick="requestFast2SMSOTP()">Request OTP</button>
            </div>

            <div id="otp-step-2">
                <div class="input-group">
                    <label for="login-otp-input">Enter 6-Digit OTP</label>
                    <input type="text" id="login-otp-input" placeholder="123456">
                </div>
                <button class="action-btn" onclick="verifyOTP()">Verify & Launch Terminal</button>
            </div>
            <div id="otp-status-msg" class="status-text"></div>
        </div>
    </div>

    <script>
        window.changeLanguage = function(lang) {
            const key = (lang || "EN").toUpperCase();
            const dict = {
                EN: {
                    title: "Autonomous Web3 Infrastructure & Cloud Node Operations",
                    desc: "Deploy high-throughput microservices, manage validator node allocations, and access real-time decentralized automation tools."
                },
                TA: {
                    title: "தன்னாட்சி Web3 உள்கட்டமைப்பு மற்றும் கிளவுட் முனை செயல்பாடுகள்",
                    desc: "அதிக செயல்திறன் கொண்ட மைக்ரோசெர்வீஸ்களைப் பயன்படுத்துங்கள், சரிபார்ப்பு முனை ஒதுக்கீடுகளை நிர்வகிக்கவும்."
                },
                HI: {
                    title: "স্বায়ত্তশাসিত Web3 অবকাঠামো এবং ক্লাউড নোড অপারেশন",
                    desc: "उच्च-थ्रूपुट माइक्रोसेर्विसेज तैनात करें, वैनिडेटर नोड आवंटन प्रबंधित करें।"
                },
                TE: {
                    title: "అటానమస్ Web3 ఇన్‌ఫ్రాస్ట్రక్చర్ & క్లౌడ్ నోడ్ ఆపరేషన్స్",
                    desc: "అధిక-త్రూపుట్ మైక్రోసర్వీసెస్‌ని అమర్చండి, వ్యాలిడేటర్ నడ్ కేటాయింపులను నిర్వహించండి."
                },
                ML: {
                    title: "ഓട്ടോണമസ് Web3 ഇൻഫ്രാസ്ട്രക്ചർ & ക്ലൗഡ് പ്രവർത്തനങ്ങൾ",
                    desc: "ഉയർന്ന ത്രൂപുട്ട് മൈക്രോസർവീസുകൾ വിന്യസിക്കുക, വാലിഡേറ്റർ നോഡ് അലോക്കേഷനങ്ങൾ കൈകാര്യം ചെയ്യുക."
                },
                KN: {
                    title: "ಸ್ವಾಯತ್ತ Web3 ಮೂಲಸೌಕರ್ಯ ಮತ್ತು ಕ್ಲೌಡ್ ನೋಡ್ ಕಾರ್ಯಾಚರಣೆಗಳು",
                    desc: "ಅಧಿಕ ಥ್ರೂಪುಟ್ ಮೈಕ್ರೋಸೆರ್ವಿಸುಗಳನ್ನು ನಿಯೋಜಿಸಿ, ವ್ಯಾಲಿಡೇಟರ್ ನೋಡ್ ಹಂಚಿಕೆಗಳನ್ನು ನಿರ್ವಹಿಸಿ."
                }
            };
            const selected = dict[key] || dict["EN"];
            const titleEl = document.getElementById('portal-hero-title');
            if (titleEl) titleEl.innerText = selected.title;
            const descEl = document.getElementById('portal-hero-desc');
            if (descEl) descEl.innerText = selected.desc;
        };

        window.requestFast2SMSOTP = async function() {
            const phoneInput = document.getElementById('login-phone-input');
            if (!phoneInput || !phoneInput.value.trim()) {
                alert('❌ Please enter a valid mobile number.');
                return;
            }
            const phone = phoneInput.value.trim();
            const statusMsg = document.getElementById('otp-status-msg');
            if (statusMsg) statusMsg.innerText = "⏳ Requesting Fast2SMS OTP for " + phone + "...";

            try {
                await fetch('/api/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phone })
                });
            } catch (e) {
                console.log("Using demo fallback for OTP");
            }

            const step1 = document.getElementById('otp-step-1');
            const step2 = document.getElementById('otp-step-2');

            if (step1) step1.style.display = 'none';
            if (step2) step2.style.display = 'block';
            if (statusMsg) statusMsg.innerText = "✅ OTP dispatched successfully to " + phone + ". (Demo Code: 123456)";
        };

        window.verifyOTP = function() {
            const otpInput = document.getElementById('login-otp-input');
            const statusMsg = document.getElementById('otp-status-msg');
            if (!otpInput || otpInput.value.trim().length < 4) {
                alert('❌ Please enter a valid 6-digit OTP code.');
                return;
            }
            if (statusMsg) statusMsg.innerText = "🚀 Authentication verified! Launching Web3 User Terminal...";
            setTimeout(() => {
                alert("🎉 Welcome to Madzinu Web3 Terminal!");
            }, 500);
        };
    </script>
</body>
</html>
