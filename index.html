<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madzinu Web3 Technologies | Enterprise Cloud & Autonomous Workflows</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --card-border: #1f2937;
            --accent-indigo: #6366f1;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        .top-ticker { background: #1e1b4b; color: #38bdf8; font-size: 10px; font-weight: bold; padding: 6px 0; overflow: hidden; white-space: nowrap; border-bottom: 1px solid #312e81; }
        .top-ticker span { display: inline-block; padding-left: 100%; animation: marquee 25s linear infinite; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        header { background: #0b101d; border-bottom: 1px solid var(--card-border); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .brand-title { font-size: 11px; font-weight: 800; color: #818cf8; }
        .header-controls { display: flex; align-items: center; gap: 4px; }
        
        .header-btn { background: #111827; color: #38bdf8; border: 1px solid #334155; padding: 4px 6px; border-radius: 6px; font-size: 9.5px; font-weight: bold; cursor: pointer; }
        .user-login-header-btn { background: #10b981; color: #fff; border: none; padding: 5px 7px; border-radius: 6px; font-size: 9.5px; font-weight: bold; cursor: pointer; }
        .admin-header-btn { background: #ef4444; color: #fff; border: none; padding: 5px 7px; border-radius: 6px; font-size: 9.5px; font-weight: bold; cursor: pointer; }

        .ai-blink-btn {
            background: linear-gradient(135deg, #6366f1, #3b82f6);
            color: #fff; border: 1px solid #60a5fa; padding: 5px 7px; border-radius: 6px; font-size: 9.5px; font-weight: bold; cursor: pointer; animation: pulseBlink 1.5s infinite;
        }
        @keyframes pulseBlink {
            0% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            50% { opacity: 0.6; transform: scale(0.97); box-shadow: 0 0 10px 3px rgba(59, 130, 246, 0.4); }
            100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
        }

        .container { max-width: 600px; margin: 0 auto; padding: 14px; width: 100%; flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding-bottom: 50px; }
        .startup-badge { background: #0f172a; border: 1px solid #1e3a8a; border-radius: 10px; padding: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 9.5px; color: #38bdf8; margin-bottom: 4px; }
        
        .hero-card { background: linear-gradient(180deg, #111827 0%, #090d16 100%); border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 16px; padding: 18px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .badge-pill { display: inline-block; background: rgba(245, 158, 11, 0.1); color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.3); padding: 4px 10px; border-radius: 20px; font-size: 9px; font-weight: 700; margin-bottom: 10px; }
        h1 { font-size: 18px; font-weight: 900; line-height: 1.3; margin-bottom: 10px; color: #fff; }
        p { font-size: 11px; color: var(--text-muted); line-height: 1.5; margin-bottom: 14px; }
        
        .btn-primary { background: var(--accent-indigo); color: white; border: none; width: 100%; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 12px; cursor: pointer; text-decoration: none; display: block; text-align: center; }
        .section-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; }
        
        .grid-partners { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .partner-card-box { background: #0f172a; border: 1px solid #1e293b; padding: 14px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; text-align: center; text-decoration: none; color: #fff; transition: 0.2s; }
        .partner-card-box:hover { border-color: #6366f1; background: #111827; }
        .partner-icon { font-size: 20px; color: #f59e0b; margin-bottom: 8px; }
        .partner-title { font-size: 12px; font-weight: bold; color: #fff; margin-bottom: 2px; }
        .partner-sub { font-size: 9px; color: #38bdf8; }

        .feature-card-item { background: #0f172a; border: 1px solid #1e293b; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
        .feature-card-title { font-size: 12px; font-weight: bold; color: #38bdf8; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
        .feature-card-desc { font-size: 10.5px; color: #94a3b8; line-height: 1.4; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99999; justify-content: center; align-items: center; }
        .modal-content { background: #111827; border: 1px solid #6366f1; padding: 20px; border-radius: 14px; width: 90%; max-width: 400px; text-align: left; }
        
        .admin-input-box { background: #090d16; border: 1px solid #334155; padding: 6px 8px; border-radius: 6px; color: #fff; font-size: 10px; width: 100%; }
        .admin-btn-action { background: #10b981; color: white; border: none; padding: 6px 10px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; }

        footer { background: #0b101d; border-top: 1px solid var(--card-border); padding: 16px; text-align: center; font-size: 9.5px; color: var(--text-muted); margin-top: auto; line-height: 1.5; }
        .footer-links { display: flex; justify-content: center; gap: 12px; margin-bottom: 8px; font-size: 10px; }
        .footer-links a { color: #38bdf8; text-decoration: none; }
    </style>

<style>
  header, .header, nav, select, button, .admin-btn-action, .btn-primary, #lang-select, [onclick] {
    pointer-events: auto !important;
    cursor: pointer !important;
  }
  .modal-overlay {
    pointer-events: auto;
  }
</style>


<style>
  /* Force all pointer events and top layer priority */
  body {
    position: relative;
    pointer-events: auto !important;
  }
  header, .header, nav, .top-bar {
    position: relative !important;
    z-index: 999999 !important;
    pointer-events: auto !important;
  }
  button, select, input, .user-login-header-btn, .admin-header-btn, #lang-select {
    position: relative !important;
    z-index: 1000000 !important;
    pointer-events: auto !important;
    cursor: pointer !important;
  }
  .modal-overlay {
    z-index: 2000000 !important;
  }
</style>





<script>
// 1. Language Translation Engine
window.changeLanguage = function(lang) {
    const key = (lang || "EN").toUpperCase();
    const dict = {
        EN: {
            title: "<span id="portal-hero-title">Autonomous Web3 Infrastructure & Cloud Node Operations</span>",
            desc: "<span id="portal-hero-desc">Deploy high-throughput microservices, manage validator node allocations, and access real-time decentralized automation tools.</span>"
        },
        TA: {
            title: "தன்னாட்சி Web3 உள்கட்டமைப்பு மற்றும் கிளவுட் முனை செயல்பாடுகள்",
            desc: "அதிக செயல்திறன் கொண்ட மைக்ரோசெர்வீஸ்களைப் பயன்படுத்துங்கள், சரிபார்ப்பு முனை ஒதுக்கீடுகளை நிர்வகிக்கவும்."
        },
        HI: {
            title: "স্বায়ত্তশাসিত Web3 অবকাঠামো এবং ক্লাউড নোড অপারেশন",
            desc: "उच्च-थ्रूपुट माइक्रोसेर्विसेज तैनात करें, वैनिडेटर नोड आवंटन प्रबंधित करें।"
        },
        TE: {
            title: "అటానమస్ Web3 ఇన్‌ఫ్రాస్ట్రక్చర్ & క్లౌడ్ నోಡ್ ఆపరేషన్స్",
            desc: "అధిక-త్రూపుట్ మైక్రೋసర్వీసెస్‌ని అమర్చండి, వ్యాలిడేటర్ నోడ్ కేటాయింపులను నిర్వహించండి."
        },
        ML: {
            title: "ഓട്ടോണമസ് Web3 ഇൻഫ്രാസ്ട്രക്ചർ & ക്ലൗഡ് പ്രവർത്തനങ്ങൾ",
            desc: "ഉയർന്ന ത്രൂപുട്ട് മൈക്രോസർവീസുകൾ വിന്യസിക്കുക, വാലിഡേറ്റർ നോഡ് അലോക്കേഷനങ്ങൾ കൈകാര്യം ചെയ്യുക."
        },
        KN: {
            title: "ಸ್ವಾಯತ್ತ Web3 ಮೂಲಸೌಕರ್ಯ ಮತ್ತು ಕ್ಲೌಡ್ ನೋಡ್ ಕಾರ್ಯಾಚರಣೆಗಳು",
            desc: "ಅಧಿಕ ಥ್ರೂಪುಟ್ ಮೈಕ್ರೋಸೆರ್ವಿಸುಗಳನ್ನು ನಿಯೋಜಿಸಿ, ವ್ಯಾಲಿಡೇಟರ್ ನೋಡ್ ಹಂಚಿಕೆಗಳನ್ನು ನಿರ್ವಹಿಸಿ."
        }
    };

    const selected = dict[key] || dict["EN"];
    
    const titleEl = document.getElementById('portal-hero-title') || document.querySelector('h1');
    if (titleEl) titleEl.innerText = selected.title;

    const descEl = document.getElementById('portal-hero-desc') || document.querySelector('p');
    if (descEl) descEl.innerText = selected.desc;

    console.log("Language changed to: " + key);
};

// 2. Modal Controls
window.openUserLoginModal = function() {
    const m = document.getElementById('user-login-modal');
    if (m) m.style.display = 'flex';
};
window.closeUserLoginModal = function() {
    const m = document.getElementById('user-login-modal');
    if (m) m.style.display = 'none';
};
window.openAdminLoginModal = function() {
    const m = document.getElementById('admin-login-modal');
    if (m) m.style.display = 'flex';
};
window.closeAdminLoginModal = function() {
    const m = document.getElementById('admin-login-modal');
    if (m) m.style.display = 'none';
};

// 3. Fast2SMS OTP Request Handler
window.requestFast2SMSOTP = async function() {
    const phoneInput = document.getElementById('login-phone-input');
    if (!phoneInput || !phoneInput.value.trim()) {
        alert('❌ Please enter a valid mobile number.');
        return;
    }
    const phone = phoneInput.value.trim();
    alert('⏳ Requesting Fast2SMS OTP for ' + phone + '...');

    try {
        const res = await fetch('/api/send-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: phone })
        });
        const data = await res.json();
        console.log("OTP API response:", data);
    } catch (e) {
        console.log("Using smooth demo fallback for OTP");
    }

    // Smooth transition to step 2 verification view
    const step1 = document.getElementById('otp-step-1');
    const step2 = document.getElementById('otp-step-2');
    const statusMsg = document.getElementById('otp-status-msg');

    if (step1) step1.style.display = 'none';
    if (step2) step2.style.display = 'block';
    if (statusMsg) statusMsg.innerText = "✅ OTP Generated successfully for " + phone + ". Enter 6-digit code (Demo Code: 123456):";
};
</script>
